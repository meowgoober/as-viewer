  :root {
    --bg: #000000;
    --fg: #ffffff;
    --line: #2b2b2b;
    --dim: #8a8a8a;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
  }

  header span {
    font-size: 12px;
    color: var(--dim);
  }

  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  nav {
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  nav li {
    border-bottom: 1px solid var(--line);
  }

  nav button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--fg);
    padding: 12px 20px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  nav button:hover {
    background: #141414;
  }

  nav li.active button {
    background: #ffffff;
    color: #000000;
    font-weight: 700;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .player-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }

  .player-bar .now-playing {
    font-size: 13px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #cast-btn {
    background: none;
    border: 1px solid var(--fg);
    color: var(--fg);
    padding: 8px 16px;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 16px;
    font-family: inherit;
    min-width: 108px;
    text-align: center;
  }

  #cast-btn:hover {
    background: var(--fg);
    color: #000000;
  }

  #cast-btn.casting {
    background: var(--fg);
    color: #000000;
  }

  .track-select {
    display: none;
    align-items: center;
    gap: 6px;
    margin-left: 16px;
    flex-shrink: 0;
  }

  .track-select button {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 8px 12px;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    font-family: inherit;
  }

  .track-select button:hover {
    color: var(--fg);
  }

  .track-select button.active-track {
    border-color: var(--fg);
    color: var(--fg);
    font-weight: 700;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 0;
  }

  .video-js {
    width: 100%;
    height: 70vh;
    max-width: 1100px;
    max-height: 100%;
    background-color: #000;
  }

  .video-js video {
    object-fit: contain;
  }

  /* strip video.js down to a plain black/white control bar */
  .video-js .vjs-control-bar {
    background: #000000;
    border-top: 1px solid var(--line);
  }

  .video-js .vjs-button > .vjs-icon-placeholder:before {
    color: var(--fg);
  }

  .video-js .vjs-play-progress,
  .video-js .vjs-volume-level {
    background: var(--fg);
  }

  .video-js .vjs-slider {
    background: #333333;
  }

  .video-js .vjs-big-play-button {
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--fg);
    border-radius: 0;
  }

  .video-js:hover .vjs-big-play-button,
  .vjs-big-play-button:focus {
    background: rgba(0,0,0,0.8);
  }
</style>

  var trackSelectEl = document.getElementById('track-select');
  var currentChannelToken = 0;

  // --- Anti-stutter live buffer ---
  // Play a bit behind the live edge so there's always a cushion of
  // already-downloaded video ahead of playback. Small drift is corrected
  // with a barely-perceptible playback-rate nudge; only a big drift (e.g.
  // after a real stall) triggers a hard seek.
  var LIVE_DELAY_SECONDS = 8;     // how far behind the live edge to sit
  var DRIFT_TOLERANCE = 2;        // ignore drift smaller than this (seconds)
  var HARD_RESYNC_THRESHOLD = 10; // drift larger than this forces a re-seek
  var RATE_ADJUST = 0.04;         // +/-4% speed nudge while correcting drift
  var liveSyncTimer = null;

    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.textContent = ch.name;
    btn.addEventListener('click', function() {

    });
    li.appendChild(btn);
    li.dataset.index = i;
    listEl.appendChild(li);
  });

  function setActive(index) {
    Array.prototype.forEach.call(listEl.children, function(li) {
      li.classList.toggle('active', Number(li.dataset.index) === index);
    });
  }

  function playChannel(index) {
    var ch = CHANNELS[index];
    var token = ++currentChannelToken;
    setActive(index);
    nowPlayingEl.textContent = ch.name;
    trackSelectEl.style.display = 'none';
    trackSelectEl.innerHTML = '';
    player.src({ src: ch.url, type: 'application/x-mpegURL' });
    player.play().catch(function() { /* autoplay may be blocked until user interacts */ });
    setupCast();
    setupVideoTracks(token);
    setupLiveSync(token);

    player.one('loadedmetadata', function() {
      var el = player.tech({ IWillNotUseThisInPlugins: true }).el();
      if (el && el.videoWidth === 0 && el.videoHeight === 0) {
        nowPlayingEl.textContent = ch.name + ' — playing audio only (no decodable video track in this browser)';
      }
    });
  }

  function clearLiveSync() {
    if (liveSyncTimer) {
      clearInterval(liveSyncTimer);
      liveSyncTimer = null;
    }
    player.playbackRate(1);
  }

  function seekBehindLive() {
    var seekable = player.seekable();
    if (!seekable || seekable.length === 0) return;
    var liveEdge = seekable.end(seekable.length - 1);
    var earliest = seekable.start(0);
    var target = Math.max(earliest, liveEdge - LIVE_DELAY_SECONDS);
    player.currentTime(target);
    player.playbackRate(1);
  }

  function setupLiveSync(token) {
    clearLiveSync();

    player.one('loadedmetadata', function() {
      if (token !== currentChannelToken) return;

      // Some "live channel" HLS setups are actually a rolling window of
      // VOD segments rather than strict live HLS, so they don't report
      // duration as Infinity even though the content is genuinely
      // advancing. Rather than trust duration(), watch whether the
      // seekable window's far edge is actually moving forward in real
      // time before applying any drift correction — that's true for a
      // rolling/live window and false for a static, already-complete VOD.
      seekBehindLive();

      var lastEdge = null;
      var lastCheck = null;
      var advancingConfirmed = false;
      var staticStreak = 0;

      liveSyncTimer = setInterval(function() {
        if (token !== currentChannelToken) { clearLiveSync(); return; }
        if (player.paused() || player.seeking()) return;

        var seekable = player.seekable();
        if (!seekable || seekable.length === 0) return;
        var liveEdge = seekable.end(seekable.length - 1);
        var now = Date.now();

        if (lastEdge !== null) {
          var edgeDelta = liveEdge - lastEdge;
          var timeDelta = (now - lastCheck) / 1000;
          if (edgeDelta > timeDelta * 0.5) {
            advancingConfirmed = true;
            staticStreak = 0;
          } else {
            staticStreak++;
          }
        }
        lastEdge = liveEdge;
        lastCheck = now;

        // Not (yet) confirmed as advancing, or it stalled out for a
        // while (e.g. the channel briefly paused its feed) — leave
        // playback alone rather than nudging it around blindly.
        if (!advancingConfirmed || staticStreak >= 3) {
          player.playbackRate(1);
          return;
        }

        var target = liveEdge - LIVE_DELAY_SECONDS;
        var drift = player.currentTime() - target; // + too close to live, - falling behind

        if (Math.abs(drift) > HARD_RESYNC_THRESHOLD) {
          seekBehindLive();
        } else if (drift > DRIFT_TOLERANCE) {
          player.playbackRate(1 - RATE_ADJUST);
        } else if (drift < -DRIFT_TOLERANCE) {
          player.playbackRate(1 + RATE_ADJUST);
        } else {
          player.playbackRate(1);
        }
      }, 3000);
    });
  }

  function renderVideoTracks(reps, activeIndex, token) {
    trackSelectEl.innerHTML = '';
    if (!reps || reps.length <= 1) {
      trackSelectEl.style.display = 'none';
      return;
    }
    trackSelectEl.style.display = 'flex';
    for (var i = 0; i < reps.length; i++) {
      (function(i) {
        var r = reps[i];
        var btn = document.createElement('button');
        var label;
        if (r.height) {
          label = r.height + 'p';
        } else if (r.bandwidth) {
          label = Math.round(r.bandwidth / 1000) + ' kbps';
        } else {
          label = 'Track ' + (i + 1);
        }
        btn.textContent = label;
        btn.classList.toggle('active-track', i === activeIndex);
        btn.addEventListener('click', function() {
          if (token !== currentChannelToken) return;
          selectRepresentation(reps, i);
          Array.prototype.forEach.call(trackSelectEl.children, function(b, bi) {
            b.classList.toggle('active-track', bi === i);
          });
        });
        trackSelectEl.appendChild(btn);
      })(i);
    }
  }

  function selectRepresentation(reps, index) {
    for (var i = 0; i < reps.length; i++) {
      reps[i].enabled(i === index);
    }
  }

  // Many of these HLS streams carry two renditions of the video in the
  // master playlist (e.g. a lower-bitrate "main" version and a much
  // higher quality second one). Video.js's bundled HLS engine (VHS)
  // exposes these as "representations" rather than as HTML videoTracks.
  // This lets the viewer force a specific rendition, defaulting to the
  // 2nd one (index 1) once VHS has parsed the manifest.
  function setupVideoTracks(token) {
    trackSelectEl.style.display = 'none';
    trackSelectEl.innerHTML = '';

    player.one('loadedmetadata', function() {
      if (token !== currentChannelToken) return;
      var tech = player.tech({ IWillNotUseThisInPlugins: true });
      var vhs = tech && tech.vhs;
      if (!vhs || typeof vhs.representations !== 'function') return;
      var reps = vhs.representations();
      if (!reps || reps.length <= 1) return;
      var defaultIndex = 1;
      selectRepresentation(reps, defaultIndex);
      renderVideoTracks(reps, defaultIndex, token);
    });
  }

  // --- Cast button ---

  // cast/AirPlay target is actually available. No availability checking,
  // no disabling — clicking it just invokes whatever casting API the
  // browser supports (or shows an alert if none exists).
  var castMode = 'none'; // 'remote' | 'airplay' | 'none'
  var castVideoEl = null;
  var castSyncTimer = null;

  function teardownCast() {
    if (castSyncTimer) {
      clearInterval(castSyncTimer);
      castSyncTimer = null;
    }
    if (castVideoEl) {
      if (castMode === 'remote' && castVideoEl.remote) {
        castVideoEl.remote.removeEventListener('connecting', updateCastLabel);
        castVideoEl.remote.removeEventListener('connect', updateCastLabel);
        castVideoEl.remote.removeEventListener('disconnect', updateCastLabel);
      } else if (castMode === 'airplay') {
        castVideoEl.removeEventListener('webkitcurrentplaybacktargetiswirelesschanged', updateCastLabel);
      }
    }
    castMode = 'none';
    castVideoEl = null;
    castBtn.classList.remove('casting');
    castBtn.textContent = 'CAST';
  }

  function updateCastLabel() {
    if (!castVideoEl) return;
    if (castMode === 'remote') {
      var state = castVideoEl.remote.state; // 'connected' | 'connecting' | 'disconnected'
      castBtn.textContent = state === 'connected' ? 'CASTING' : (state === 'connecting' ? 'CONNECTING…' : 'CAST');
      castBtn.classList.toggle('casting', state !== 'disconnected');
    } else if (castMode === 'airplay') {
      var wireless = !!castVideoEl.webkitCurrentPlaybackTargetIsWireless;
      castBtn.textContent = wireless ? 'AIRPLAYING' : 'AIRPLAY';
      castBtn.classList.toggle('casting', wireless);
    }
  }

  function setupCast() {
    teardownCast();
    var tech = player.tech({ IWillNotUseThisInPlugins: true });
    var videoEl = tech && tech.el();
    if (!videoEl) return;
    castVideoEl = videoEl;

    if (videoEl.remote && typeof videoEl.remote.prompt === 'function') {
      castMode = 'remote';
      castBtn.textContent = 'CAST';

      videoEl.remote.addEventListener('connecting', updateCastLabel);
      videoEl.remote.addEventListener('connect', updateCastLabel);
      videoEl.remote.addEventListener('disconnect', updateCastLabel);
    } else if (typeof videoEl.webkitShowPlaybackTargetPicker === 'function') {
      castMode = 'airplay';
      castBtn.textContent = 'AIRPLAY';

      videoEl.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', updateCastLabel);
    } else {
      castMode = 'none';
      castBtn.textContent = 'CAST';
    }

    if (castMode !== 'none') {
      // Events aren't dispatched consistently across every Remote
      // Playback / AirPlay implementation, so poll the underlying state
      // too, to keep the label in sync.
      castSyncTimer = setInterval(updateCastLabel, 1500);
    }
  }

  castBtn.addEventListener('click', function() {
    if (!castVideoEl) return;
    if (castMode === 'remote') {
      castVideoEl.remote.prompt().catch(function(err) {
        alert('Casting is unavailable right now: ' + err.message);
      });
    } else if (castMode === 'airplay') {
      castVideoEl.webkitShowPlaybackTargetPicker();
    } else {
      alert('This browser does not support casting from the player. Try Chrome/Edge for Cast, Safari for AirPlay, or use the browser tab-cast option instead.');
    }
  });

  player.ready(function() {
    setupCast();
  });
</script>
